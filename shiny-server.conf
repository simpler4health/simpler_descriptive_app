# Shiny Server configuration for the SIMPLER Descriptive App on SciLifeLab Serve.
# Same as the rocker/shiny default, except:
#   - log_dir: the R output of the app (errors included) is written to the mounted volume,
#     so it can be read with the Serve File Manager (project-vol/logs/).
#   - preserve_logs: keep the log file also when the app session ends without errors.
#   - sanitize_errors false: show the real error message in the browser.
#     TESTING ONLY: set it back to true (or remove the line) before the app is made public.
run_as shiny;
preserve_logs true;

server {
  listen 3838;

  location / {
    site_dir /srv/shiny-server;
    log_dir /srv/shiny-server/data/logs;
    directory_index off;
    sanitize_errors false;
  }
}
